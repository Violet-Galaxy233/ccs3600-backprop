  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="435">Measures how far predictions are</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="459">from true labels:</text><path fill="#0F172A" stroke="#334155" stroke-width="1" d="M128,490 H592 A8,8 0 0 1 600,498 V526 A8,8 0 0 1 592,534 H128 A8,8 0 0 1 120,526 V498 A8,8 0 0 1 128,490 Z" />

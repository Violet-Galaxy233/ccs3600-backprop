  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="100" y="565">Low C = good prediction</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="100" y="585">High C = poor prediction</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M672,130 H1208 A12,12 0 0 1 1220,142 V378 A12,12 0 0 1 1208,390 H672 A12,12 0 0 1 660,378 V142 A12,12 0 0 1 672,130 Z" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#0F172A" />
  <rect x="0" y="0" width="1280" height="720" fill="url(#centerGlow)" />
  <path fill="url(#titleGrad)" d="M62,50 H138 A2,2 0 0 1 140,52 V52 A2,2 0 0 1 138,54 H62 A2,2 0 0 1 60,52 V52 A2,2 0 0 1 62,50 Z" />
  <text x="60" y="90" font-family="Georgia, 'Microsoft YaHei', serif" font-size="30" font-weight="bold" fill="#F1F5F9">Computing the Loss Gradient</text>

  
  <path fill="#1E293B" stroke="#3B82F6" stroke-width="2" d="M356,160 H924 A16,16 0 0 1 940,176 V244 A16,16 0 0 1 924,260 H356 A16,16 0 0 1 340,244 V176 A16,16 0 0 1 356,160 Z" />
  <text x="640" y="200" text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="16" fill="#94A3B8">Must calculate derivative of C with respect to every weight:</text>
  <text x="640" y="237" text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="24" fill="#F1F5F9">∂C / ∂w</text>
  <text x="712" y="244" font-family="Georgia, 'Microsoft YaHei', serif" font-size="14" fill="#22D3EE">i,j,k</text>

  
  
  <line x1="460" y1="260" x2="250" y2="340" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="210" cy="360" r="55" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
  <text x="210" y="350" text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="24" font-weight="bold" fill="#F59E0B">C</text>
  <text x="210" y="375" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">Loss Function</text>

  
  <line x1="820" y1="260" x2="1030" y2="340" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="1070" cy="360" r="55" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
  <text x="1070" y="350" text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#3B82F6">w</text>
  <text x="1088" y="358" font-family="Georgia, 'Microsoft YaHei', serif" font-size="12" fill="#94A3B8">i,j,k</text>
  <text x="1070" y="380" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">Network Weight</text>

  
  <line x1="640" y1="260" x2="640" y2="440" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="640" cy="480" r="55" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  
  <g transform="translate(620.0, 460.0) scale(1.6666666666666667)" fill="#10B981">
    <path d="M20 18a1 1 0 0 1 .117 1.993l-.117 .007h-16a1 1 0 0 1 -.117 -1.993l.117 -.007h16z" />
    <path d="M15.22 5.375a1 1 0 0 1 1.393 -.165l.094 .083l4 4a1 1 0 0 1 .284 .576l.009 .131v5a1 1 0 0 1 -.883 .993l-.117 .007h-16.022l-.11 -.009l-.11 -.02l-.107 -.034l-.105 -.046l-.1 -.059l-.094 -.07l-.06 -.055l-.072 -.082l-.064 -.089l-.054 -.096l-.016 -.035l-.04 -.103l-.027 -.106l-.015 -.108l-.004 -.11l.009 -.11l.019 -.105c.01 -.04 .022 -.077 .035 -.112l.046 -.105l.059 -.1l4 -6a1 1 0 0 1 1.165 -.39l.114 .05l3.277 1.638l3.495 -4.369z" />
  </g>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" fill="#94A3B8">Minimize C</text>

  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M132,570 H1148 A12,12 0 0 1 1160,582 V658 A12,12 0 0 1 1148,670 H132 A12,12 0 0 1 120,658 V582 A12,12 0 0 1 132,570 Z" />
  <text x="160" y="605" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#22D3EE">Weight Notation</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="160" y="640">w</text><text x="172" y="646" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" fill="#22D3EE">i,j,k</text>
  <text x="200" y="640" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8"> = weight from node j in layer (i-1) to node k in layer i. Each weight is updated individually to reduce C.</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#64748B">10</text>
</svg>
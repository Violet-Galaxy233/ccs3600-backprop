  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="300">Understand the</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="324">architecture and</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="348">mechanics of feed-</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="372">forward neural</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="396">networks and how</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="420">information flows</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="80" y="444">through layers</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M372,160 H618 A12,12 0 0 1 630,172 V628 A12,12 0 0 1 618,640 H372 A12,12 0 0 1 360,628 V172 A12,12 0 0 1 372,160 Z" />

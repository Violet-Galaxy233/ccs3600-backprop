  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="300">Master the back-</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="324">propagation algorithm,</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="348">its mathematical</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="372">foundation including</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="396">loss functions, chain</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="420">rule, and gradient</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="380" y="444">computation</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M672,160 H918 A12,12 0 0 1 930,172 V628 A12,12 0 0 1 918,640 H672 A12,12 0 0 1 660,628 V172 A12,12 0 0 1 672,160 Z" />

  <text text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="14" fill="#22D3EE" x="230" y="310">Short for</text><text text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="14" fill="#22D3EE" x="230" y="332">"Backward Propagation</text><text text-anchor="middle" font-family="Georgia, 'Microsoft YaHei', serif" font-size="14" fill="#22D3EE" x="230" y="354">of Errors"</text><line x1="120" y1="400" x2="340" y2="400" stroke="#10B981" stroke-width="2" />

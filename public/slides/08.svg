  <text x="150" y="505" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#F1F5F9">How It All Connects</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="545">Each layer receives the previous layer's output as input. The entire network is a composition</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="571">of functions: the output of each layer feeds into the next. This chained structure is what</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="597">makes backpropagation possible — the chain rule can be applied to compute gradients</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8" x="100" y="623">efficiently, layer by layer, from the output back to the input.</text><text x="1220" y="700" text-anchor="end" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#64748B">08</text>
</svg>
  <line x1="870" y1="180" x2="1190" y2="180" stroke="#334155" stroke-width="1" />
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="210">Neural networks trained via BP</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="234">excel at automated, consistent</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="258">pattern recognition.</text><path fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" d="M878,290 H1192 A8,8 0 0 1 1200,298 V332 A8,8 0 0 1 1192,340 H878 A8,8 0 0 1 870,332 V298 A8,8 0 0 1 878,290 Z" />
  

  <text x="100" y="92" font-family="Georgia, 'Microsoft YaHei', serif" font-size="30" font-weight="bold" fill="#F1F5F9">Pattern Recognition</text>

  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M72,120 H418 A12,12 0 0 1 430,132 V648 A12,12 0 0 1 418,660 H72 A12,12 0 0 1 60,648 V132 A12,12 0 0 1 72,120 Z" />
  <path fill="#3B82F6" d="M63,120 H427 A3,3 0 0 1 430,123 V123 A3,3 0 0 1 427,126 H63 A3,3 0 0 1 60,123 V123 A3,3 0 0 1 63,120 Z" />
  <text x="80" y="165" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#3B82F6">What is a Pattern?</text>
  <line x1="80" y1="180" x2="400" y2="180" stroke="#334155" stroke-width="1" />
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="210">A set of objects or phenomena</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="234">where the elements share</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="258">similar traits or characteristics.</text><path fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" d="M88,290 H402 A8,8 0 0 1 410,298 V352 A8,8 0 0 1 402,360 H88 A8,8 0 0 1 80,352 V298 A8,8 0 0 1 88,290 Z" />
  <text x="96" y="318" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#F1F5F9">Biological Examples:</text>
  <text x="96" y="342" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#3B82F6">Paramecium, Amoeba, Euglena</text>

  <path fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" d="M88,380 H402 A8,8 0 0 1 410,388 V442 A8,8 0 0 1 402,450 H88 A8,8 0 0 1 80,442 V388 A8,8 0 0 1 88,380 Z" />
  <text x="96" y="408" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#F1F5F9">Celestial Examples:</text>
  <text x="96" y="432" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8B5CF6">Star constellations in night sky</text>

  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M467,120 H813 A12,12 0 0 1 825,132 V648 A12,12 0 0 1 813,660 H467 A12,12 0 0 1 455,648 V132 A12,12 0 0 1 467,120 Z" />
  <path fill="#22D3EE" d="M458,120 H822 A3,3 0 0 1 825,123 V123 A3,3 0 0 1 822,126 H458 A3,3 0 0 1 455,123 V123 A3,3 0 0 1 458,120 Z" />
  <text x="475" y="165" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#22D3EE">Human Perception</text>
  <line x1="475" y1="180" x2="795" y2="180" stroke="#334155" stroke-width="1" />
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="210">Humans naturally find patterns</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="234">even in completely random</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="258">noise and visual data.</text><path fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3" d="M483,290 H797 A8,8 0 0 1 805,298 V372 A8,8 0 0 1 797,380 H483 A8,8 0 0 1 475,372 V298 A8,8 0 0 1 483,290 Z" />
  <text x="491" y="318" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#F1F5F9">Pareidolia Effect</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8" x="491" y="342">Perceiving meaningful shapes in</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#94A3B8" x="491" y="362">clouds, rock formations, noise</text><path fill="#F59E0B" fill-opacity="0.08" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3" d="M483,400 H797 A8,8 0 0 1 805,408 V462 A8,8 0 0 1 797,470 H483 A8,8 0 0 1 475,462 V408 A8,8 0 0 1 483,400 Z" />
  

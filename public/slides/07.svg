  <text x="1050" y="540" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#8B5CF6">t3</text>
  <line x1="1070" y1="535" x2="1090" y2="535" stroke="#8B5CF6" stroke-width="1" />
  <text x="1100" y="540" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B5CF6">...</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#64748B">07</text>

  <text x="118" y="145" font-family="Georgia, 'Microsoft YaHei', serif" font-size="30" font-weight="bold" fill="#F1F5F9">Why We Need Backpropagation</text>

  
  <text x="118" y="178" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94A3B8">The essential algorithm that makes deep learning possible</text>

  
  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M112,230 H408 A12,12 0 0 1 420,242 V368 A12,12 0 0 1 408,380 H112 A12,12 0 0 1 100,368 V242 A12,12 0 0 1 112,230 Z" />
  <path fill="#3B82F6" d="M102,230 H102 A2,2 0 0 1 104,232 V378 A2,2 0 0 1 102,380 H102 A2,2 0 0 1 100,378 V232 A2,2 0 0 1 102,230 Z" />
  <text x="124" y="268" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Simplifies Structure</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="298">Removes least-effective weighted</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="320">links, streamlining the network</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="342">for better performance</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M492,230 H788 A12,12 0 0 1 800,242 V368 A12,12 0 0 1 788,380 H492 A12,12 0 0 1 480,368 V242 A12,12 0 0 1 492,230 Z" />
  <path fill="#22D3EE" d="M482,230 H482 A2,2 0 0 1 484,232 V378 A2,2 0 0 1 482,380 H482 A2,2 0 0 1 480,378 V232 A2,2 0 0 1 482,230 Z" />
  <text x="504" y="268" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Reveals Relationships</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="298">Uncovers the relationship between</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="320">input layers and hidden unit layers</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="342">during training</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M872,230 H1168 A12,12 0 0 1 1180,242 V368 A12,12 0 0 1 1168,380 H872 A12,12 0 0 1 860,368 V242 A12,12 0 0 1 872,230 Z" />
  <path fill="#8B5CF6" d="M862,230 H862 A2,2 0 0 1 864,232 V378 A2,2 0 0 1 862,380 H862 A2,2 0 0 1 860,378 V232 A2,2 0 0 1 862,230 Z" />
  <text x="884" y="268" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Assesses Impact</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="298">Measures how each input variable</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="320">influences the final network</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="342">output accuracy</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M112,420 H408 A12,12 0 0 1 420,432 V558 A12,12 0 0 1 408,570 H112 A12,12 0 0 1 100,558 V432 A12,12 0 0 1 112,420 Z" />
  <path fill="#10B981" d="M102,420 H102 A2,2 0 0 1 104,422 V568 A2,2 0 0 1 102,570 H102 A2,2 0 0 1 100,568 V422 A2,2 0 0 1 102,420 Z" />
  <text x="124" y="458" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Deep Network Essential</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="488">Critical for deep neural networks</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="510">in error-prone and complex</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="124" y="532">real-world projects</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M492,420 H788 A12,12 0 0 1 800,432 V558 A12,12 0 0 1 788,570 H492 A12,12 0 0 1 480,558 V432 A12,12 0 0 1 492,420 Z" />
  <path fill="#F59E0B" d="M482,420 H482 A2,2 0 0 1 484,422 V568 A2,2 0 0 1 482,570 H482 A2,2 0 0 1 480,568 V422 A2,2 0 0 1 482,420 Z" />
  <text x="504" y="458" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Mathematical Elegance</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="488">Leverages chain and power rules</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="510">for efficient gradient computation</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="504" y="532">across any number of outputs</text><path fill="#1E293B" stroke="#334155" stroke-width="1" d="M872,420 H1168 A12,12 0 0 1 1180,432 V558 A12,12 0 0 1 1168,570 H872 A12,12 0 0 1 860,558 V432 A12,12 0 0 1 872,420 Z" />
  <path fill="#3B82F6" d="M862,420 H862 A2,2 0 0 1 864,422 V568 A2,2 0 0 1 862,570 H862 A2,2 0 0 1 860,568 V422 A2,2 0 0 1 862,420 Z" />
  <text x="884" y="458" font-family="Georgia, 'Microsoft YaHei', serif" font-size="17" font-weight="bold" fill="#F1F5F9">Computational Necessity</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="488">Without backpropagation, training</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="510">deep networks would be</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#94A3B8" x="884" y="532">computationally infeasible</text><path fill="url(#titleGrad)" fill-opacity="0.4" d="M541.50,630 H738.50 A1.50,1.50 0 0 1 740,631.50 V631.50 A1.50,1.50 0 0 1 738.50,633 H541.50 A1.50,1.50 0 0 1 540,631.50 V631.50 A1.50,1.50 0 0 1 541.50,630 Z" />

  <text x="1220" y="700" text-anchor="end" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10" fill="#64748B">14</text>

  <text x="118" y="167" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#3B82F6">Standard Backpropagation</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="200">Applies to feedforward networks (directed acyclic graph)</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="224">Chain rule applied recursively through layers</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="248">Static input-output mapping, no temporal dependency</text><path fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1" d="M106,280 H144 A6,6 0 0 1 150,286 V304 A6,6 0 0 1 144,310 H106 A6,6 0 0 1 100,304 V286 A6,6 0 0 1 106,280 Z" />

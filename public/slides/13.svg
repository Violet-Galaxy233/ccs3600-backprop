  <text x="709" y="430" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#8B5CF6">Vanishing Gradient Problem</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="675" y="462">Distant interactions produce diminishingly small gradients</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="675" y="486">Makes learning long-range dependencies very difficult</text><path fill="#1E293B" stroke="#10B981" stroke-width="1.5" d="M72,560 H1208 A12,12 0 0 1 1220,572 V658 A12,12 0 0 1 1208,670 H72 A12,12 0 0 1 60,658 V572 A12,12 0 0 1 72,560 Z" />
  

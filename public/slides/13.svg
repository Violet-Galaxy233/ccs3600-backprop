  <text x="114" y="430" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#F59E0B">BPTT Challenges</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="462">Large unrolled networks become difficult to train</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="486">Easily trapped in local optima during optimization</text><path fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5" d="M667,390 H1208 A12,12 0 0 1 1220,402 V518 A12,12 0 0 1 1208,530 H667 A12,12 0 0 1 655,518 V402 A12,12 0 0 1 667,390 Z" />
  

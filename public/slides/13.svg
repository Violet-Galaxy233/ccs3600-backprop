  <text x="713" y="167" font-family="Georgia, 'Microsoft YaHei', serif" font-size="20" font-weight="bold" fill="#22D3EE">Backpropagation Through Time</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="675" y="200">"Unrolls" recurrent neural network across time steps</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="675" y="224">Treats unrolled RNN as feedforward for training</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="675" y="248">Handles sequential, time-dependent data</text><path fill="#22D3EE" fill-opacity="0.2" stroke="#22D3EE" stroke-width="1" d="M700,280 H734 A5,5 0 0 1 739,285 V303 A5,5 0 0 1 734,308 H700 A5,5 0 0 1 695,303 V285 A5,5 0 0 1 700,280 Z" />

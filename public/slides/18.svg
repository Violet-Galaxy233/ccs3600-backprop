  <polygon points="645,603 653,607 645,611" fill="#22D3EE" />
  <path fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1" d="M662,590 H760 A6,6 0 0 1 766,596 V618 A6,6 0 0 1 760,624 H662 A6,6 0 0 1 656,618 V596 A6,6 0 0 1 662,590 Z" />
  <text x="711" y="612" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#3B82F6">English</text>

  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M862,440 H1208 A12,12 0 0 1 1220,452 V658 A12,12 0 0 1 1208,670 H862 A12,12 0 0 1 850,658 V452 A12,12 0 0 1 862,440 Z" />
  <path fill="#10B981" d="M853,440 H1217 A3,3 0 0 1 1220,443 V443 A3,3 0 0 1 1217,446 H853 A3,3 0 0 1 850,443 V443 A3,3 0 0 1 853,440 Z" />
  <text x="870" y="482" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#10B981">BP Role in Training</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="514">Backpropagation adjusts weights</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="538">across all 5 layers by computing</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="562">gradients of the cross-entropy</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="870" y="586">loss with respect to each weight.</text><path fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" d="M876,610 H1174 A6,6 0 0 1 1180,616 V640 A6,6 0 0 1 1174,646 H876 A6,6 0 0 1 870,640 V616 A6,6 0 0 1 876,610 Z" />
  

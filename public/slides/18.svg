  <text x="80" y="482" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#3B82F6">Network Architecture</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="514">5-layer deep neural network</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="80" y="538">optimized for embedded devices</text><path fill="#0F172A" stroke="#334155" stroke-width="1" d="M86,564 H404 A6,6 0 0 1 410,570 V598 A6,6 0 0 1 404,604 H86 A6,6 0 0 1 80,598 V570 A6,6 0 0 1 86,564 Z" />
  <text x="245" y="590" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#F1F5F9">Loss = -sum(y * log(y_hat))</text>

  <text x="80" y="640" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#64748B">Softmax cross-entropy for multi-class output</text>

  
  <path fill="#1E293B" stroke="#334155" stroke-width="1" d="M467,440 H813 A12,12 0 0 1 825,452 V658 A12,12 0 0 1 813,670 H467 A12,12 0 0 1 455,658 V452 A12,12 0 0 1 467,440 Z" />
  <path fill="#22D3EE" d="M458,440 H822 A3,3 0 0 1 825,443 V443 A3,3 0 0 1 822,446 H458 A3,3 0 0 1 455,443 V443 A3,3 0 0 1 458,440 Z" />
  <text x="475" y="482" font-family="Georgia, 'Microsoft YaHei', serif" font-size="18" font-weight="bold" fill="#22D3EE">Transfer Learning</text>
  <text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="514">Train on Japanese data first,</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="538">then transfer learned features</text><text font-family="Arial, 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" fill="#94A3B8" x="475" y="562">to English recognition model.</text><path fill="#22D3EE" fill-opacity="0.15" stroke="#22D3EE" stroke-width="1" d="M501,590 H599 A6,6 0 0 1 605,596 V618 A6,6 0 0 1 599,624 H501 A6,6 0 0 1 495,618 V596 A6,6 0 0 1 501,590 Z" />
  <text x="550" y="612" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#22D3EE">Japanese</text>
